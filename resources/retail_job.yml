resources:
  jobs:
    retail_etl:
      name: webinar-retail-etl
      description: Demo Bronze Silver Gold desplegada con Declarative Automation Bundles
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema_prefix
          default: ${var.schema_prefix}
        - name: source_path
          default: ${workspace.file_path}/data/ventas.csv
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../src/01_bronze.py
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../src/02_silver.py
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../src/03_gold.py
